<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Script Generator - Oura Identity</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.3s; }
        button:hover { background: #0369a1; }
        textarea { margin-top: 10px; resize: vertical; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Commercial Script Generator</h2>
        
        <form id="script-generator-form">
            <div class="form-group">
                <label for="brandName">Brand Name:</label>
                <input type="text" id="brandName" placeholder="e.g. Khadi Fabrics" required>
            </div>
            
            <div class="form-group">
                <label for="targetAudience">Target Audience / Niche:</label>
                <input type="text" id="targetAudience" placeholder="e.g. Women fashion & winter wear" required>
            </div>

            <button type="submit" id="generate-btn">Generate Commercial Script</button>
        </form>

        <div class="form-group" style="margin-top: 25px;">
            <label for="script-output">Generated Script Output:</label>
            <textarea id="script-output" rows="10" placeholder="Your generated script will appear here..."></textarea>
        </div>
    </div>

    <!-- Yeh line aapki JS file ko HTML ke sath jorti hai -->
    <script src="ai-tools.js"></script>
</body>
</html>
